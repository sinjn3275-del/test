name: Update stock closing prices

on:
  schedule:
    # 공공데이터는 거래일 다음 영업일 오후에 올라오므로 월~토 KST 14:10, 18:10에 확인
    # (금요일 시세는 월요일에 올라와요)
    - cron: "10 5 * * 1-6"
    - cron: "10 9 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch closing prices
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-stocks.mjs

      - name: Commit data
        run: |
          git add data/stocks
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stock closing prices"
          git push

      - name: Sync prices, settle orders and refresh rankings in Supabase
        env:
          SUPABASE_URL: https://vlytmxbrvtmiclkxnewi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-supabase.mjs
