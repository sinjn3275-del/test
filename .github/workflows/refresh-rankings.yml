name: Refresh rankings

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-rankings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh rankings in Supabase
        env:
          SUPABASE_URL: https://vlytmxbrvtmiclkxnewi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-supabase.mjs --rankings-only
