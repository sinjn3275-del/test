<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>플렉스시티 3D 미리보기</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6cc3f5; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #town { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
  .chip { background: rgba(255,255,255,.88); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; color: #1d2433; box-shadow: 0 2px 8px rgba(0,0,0,.15); text-decoration: none; border: 0; }
  #tip { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 600; white-space: nowrap; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: #1d2433; font-weight: 700; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="town"></div>
<div id="hud">
  <a class="chip" href="./">← 게임으로</a>
  <span class="chip" id="label">내 세상 3D</span>
  <button class="chip" id="dayBtn">☀️ 낮</button>
</div>
<div class="chip" id="tip">드래그: 돌리기 · 두 손가락/휠: 확대</div>
<div id="err">3D를 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.</div>
<script type="module">
import { townViewer } from "./town3d.js";

// Shown when this browser has no save yet, so the preview isn't empty.
const DEMO = { "house-apt": "1,1", "house-penthouse": "5,1", "house-mansion": "0,4", "car-super": "2,4", "car-sports": "4,3", "car-hyper": "4,5", "sp-heli": "6,4", "sp-jet": "5,0", "sp-yacht": "1,6" };
let save = {};
try { save = JSON.parse(localStorage.getItem("flexcity.v1")) || {}; } catch (e) { /* no save */ }
const demo = !save.place || !Object.keys(save.place).length;
document.getElementById("label").textContent = demo ? "3D 미리보기 (예시 동네)" : "내 세상 3D";

const town = townViewer(document.getElementById("town"));
town.update({ place: demo ? DEMO : save.place, avatar: save.avatar || {} });
const h = new Date().getHours();
const setNight = v => { town.setNight(v); document.getElementById("dayBtn").textContent = v ? "🌙 밤" : "☀️ 낮"; };
setNight(h >= 19 || h < 6);
document.getElementById("dayBtn").addEventListener("click", () => setNight(!town.night));
town.start();
addEventListener("resize", () => town.resize());
window.__ready = true;
</script>
<script>
  setTimeout(() => { if (!window.__ready) document.getElementById("err").style.display = "grid"; }, 8000);
</script>
</body>
</html>
